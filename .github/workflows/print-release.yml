# Build the print artifacts and attach them to a GitHub Release.
#
# The PDFs are not in git (`printing/README.md`) — they are build output, and
# committing them cost a full new copy of each file every time one changed.
# This is the other half of that decision: tag a version and the sheets come
# out the far end as downloads, built from the tagged source, so nobody needs
# Python and Chrome on their own machine to print a deck.
#
#   git tag v2026.09.20 && git push origin v2026.09.20
#
# Or run it by hand from the Actions tab to get a build without tagging.

name: Print artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The runner image ships Google Chrome, but resolve it rather than
      # assume a path — a silently wrong CHROME is a silently empty PDF.
      - name: Find Chrome
        run: |
          for c in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$c" >/dev/null; then
              echo "CHROME=$(command -v "$c")" >> "$GITHUB_ENV"
              echo "using $(command -v "$c")"
              exit 0
            fi
          done
          echo "::error::no Chrome on the runner — the PDF step cannot run"
          exit 1

      # --check fails if any sheet's HTML was out of date, so a release can
      # never be cut from sheets that disagree with the markdown. Regenerate
      # and commit the HTML if this trips.
      - name: Build
        run: ./printing/generate-all.sh --check

      # Chrome exits 0 on some failures and leaves a stub behind, so the
      # build is not trusted until the files have been looked at.
      - name: Check the PDFs are real
        run: |
          missing=0
          shopt -s nullglob
          for f in printing/*.pdf; do
            size=$(stat -c%s "$f")
            head=$(head -c 5 "$f")
            if [ "$size" -lt 20000 ] || [ "$head" != "%PDF-" ]; then
              echo "::error::$f is $size bytes and starts '$head'"
              missing=1
            else
              printf '  %-42s %s\n' "$(basename "$f")" "$(numfmt --to=iec "$size")"
            fi
          done
          count=$(ls printing/*.pdf 2>/dev/null | wc -l)
          echo "$count PDFs built"
          [ "$count" -ge 11 ] || { echo "::error::expected 11 or more, got $count"; missing=1; }
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: print-artifacts
          path: printing/*.pdf
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Print artifacts for this tag, built from its own source by
          `printing/generate-all.sh`.

          **Card sheets** — the core pool, the Oracle and its thirds, the
          expansion, and Washed Ashore. **Character sheets.** **Rules** — the
          packet and the play reference.

          The PDFs are not stored in the repository; these were generated at
          tag time. To build them yourself, see `printing/README.md` — it
          needs Python 3 and headless Chrome and nothing else.
          EOF
          gh release create "${GITHUB_REF_NAME}" printing/*.pdf \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes
